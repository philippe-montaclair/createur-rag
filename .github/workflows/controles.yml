# Le seul contrôle du dépôt, et il suffit : les 218 assertions de
# test_briques.py et test_regleur.py montent les briques, les trois profils
# et la mémoire de réglage SANS aucun modèle, sans Ollama et sans index.
# Si l'un tombe, c'est qu'une brique ne tient plus le contrat du README.
name: controles

# workflow_dispatch permet de relancer les contrôles à la main depuis
# l'onglet Actions ou avec `gh workflow run controles.yml`, sans avoir à
# fabriquer un commit vide juste pour voir si ça passe.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  briques:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyYAML et rien d'autre. Les profils sont des fichiers YAML : c'est la
      # seule dépendance que ces contrôles exigent. Le jour où cette ligne
      # s'allonge, les contrôles ont cessé d'être ce qu'ils prétendent être —
      # exécutables sur une machine où aucun modèle n'est installé.
      - name: la seule dépendance des contrôles
        run: pip install pyyaml

      - name: montage des briques et des trois profils
        run: python3 tests/test_briques.py

      - name: mémoire de réglage et comparabilité des mesures
        run: python3 tests/test_regleur.py

      # Le lecteur de jeux d'évaluation porte tout chiffre publié dans
      # MESURES.md : s'il avale un bloc en silence ou range une hors-corpus
      # avec les autres, le score annoncé décrit une autre population que
      # celle qu'il prétend décrire.
      - name: lecteur de jeux d'évaluation
        run: python3 tests/test_jeu.py

      # Le comparateur porte la règle qui refuse d'appeler « gain » un écart
      # indistinguable du bruit. C'est celle qu'on a envie de contourner le jour
      # où le profil qu'on préfère passe devant de trois millisecondes.
      - name: comparateur de profils
        run: python3 tests/test_comparaison.py

  # ── Second job : l'épreuve que le job « briques » ne fait pas ────────
  # Les contrôles ci-dessus prouvent que les briques tiennent leur contrat.
  # Ils ne prouvent PAS qu'un inconnu qui clone ce dépôt arrive à
  # l'installer : ils n'installent que pyyaml. Ce job-ci fait exactement
  # ce que ferait ce visiteur, sur une machine vide — installer
  # requirements.txt, puis importer chaque module. Aucun modèle n'est
  # téléchargé, aucune génération n'est lancée : on vérifie que le paquet
  # se monte, pas qu'il répond.
  #
  # Le jour où il passe au rouge sans qu'on ait touché au code, c'est
  # qu'une dépendance tierce a bougé sous nos pieds. C'est le genre de
  # chose qu'il vaut mieux apprendre ici que par un client.
  installation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: installation telle qu'elle est documentee dans le README
        run: pip install -r requirements.txt

      - name: chaque module s'importe sur une machine nue
        run: |
          python -c "import contrat, catalogue, memoire, observabilite, ingestion, createur"
          python -c "import briques.recherche_vectorielle, briques.recherche_bm25, briques.fusion"
          python -c "import briques.reranker, briques.routeur, briques.validateur_chunks"
          python -c "import briques.agent_llm, briques.prompt_engineering"
          python -c "import briques.constructeur_contexte, briques.post_processing"
          python -c "import backends.ollama, mesures.jeu, mesures.comparer_profils"

      - name: les trois profils se lisent et se montent
        run: python tests/test_briques.py

  # ── Troisième job : le linter que le projet declare ──────────────────
  # Un outil de style configure et jamais lance ne garantit rien. Celui-ci
  # tourne, et il est vert : les 8 signalements de ruff du 02/09/2026
  # (imports inutilises, f-strings sans variable, variables nommees `l`)
  # ont ete corriges avant de l'activer, pour que le premier passage dise
  # quelque chose de vrai plutot que d'installer un rouge permanent.
  #
  # ruff seul, jamais black : sur ce code il defait un alignement de
  # commentaires en colonnes qui est delibere, sur 32 fichiers. Il a ete
  # retire de rag-evaluation-agent le 02/09/2026 pour la meme raison, et
  # il n'a jamais ete declare ici. Le choix est assume.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ruff, version figee
        run: pip install "ruff==0.15.*"

      - name: aucun signalement
        run: ruff check --output-format concise .
